services:
  teamspeak:
    image: teamspeak:3.13
    container_name: ${TS3_CONTAINER_NAME}
    restart: always
    ports:
      - "${TS3_PORT_UDP}:9987/udp"
      - "${TS3_PORT_FILE}:30033"
      # ServerQuery raw — только localhost, не публикуйте наружу
      - "127.0.0.1:${TS3_PORT_QUERY:-10011}:10011"
    # Полное состояние сервера (БД, логи, licensekey.dat) — копируйте teamspeak-data на другой хост для переноса
    volumes:
      - ./teamspeak-data:/var/ts3server
    environment:
      TS3SERVER_LICENSE: ${TS3SERVER_LICENSE}
      TS3SERVER_LICENSEPATH: ${TS3SERVER_LICENSEPATH:-/var/ts3server}
      TS3SERVER_QUERY_PROTOCOLS: raw
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 30033 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 1g
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Разметка гильдии: docker compose --profile tools run --rm seeder
  seeder:
    image: python:3.12-alpine
    profiles: ["tools"]
    network_mode: "service:teamspeak"
    depends_on:
      teamspeak:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    working_dir: /scripts
    environment:
      TS3_QUERY_HOST: "127.0.0.1"
      TS3_QUERY_PORT: "10011"
      TS3_QUERY_USER: ${TS3_QUERY_USER:-serveradmin}
      TS3_QUERY_PASSWORD: ${TS3_QUERY_PASSWORD}
      PYTHONIOENCODING: "utf-8"
    entrypoint: ["python", "seed_guild.py"]
